function similarity(a,b){a=norm(a).split(' ').filter(Boolean);b=norm(b).split(' ').filter(Boolean);if(!a.length)return 0;let m=0;const used=new Set();a.forEach(w=>{const i=b.findIndex((x,i)=>x===w&&!used.has(i));if(i>-1){m++;used.add(i)}});return Math.round(m/Math.max(a.length,b.length)*100)}
function diffWords(target,typed){const t=norm(target).split(' '),u=norm(typed).split(' ');return t.map((w,i)=>u[i]===w?`<span style="color:var(--good)">${esc(w)}</span>`:`<span class="hl" style="color:var(--bad)">${esc(w)}</span>`).join(' ')}
function copy(text){navigator.clipboard.writeText(text).then(()=>toast('복사했어요')).catch(()=>{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('복사했어요')}catch(e){toast('복사 실패: 직접 선택해서 복사하세요')}ta.remove()})}

 <div class="card"><h3>💾 백업 / 복원</h3><p class="small muted" style="margin-top:4px">기록 ${L.length}개 · 학생 ${studentsOf().length}명 · 제출물 ${store.get('subs',[]).length}개</p><div class="row" style="margin-top:10px"><button id="bk">백업 복사(JSON)</button><button id="csv">활동 CSV 복사</button></div><textarea id="rs" placeholder="백업 JSON을 붙여 넣고 복원" style="margin-top:10px;min-height:70px;font-family:ui-monospace,monospace;font-size:12px"></textarea><div class="row" style="justify-content:space-between;margin-top:10px"><button id="restore">복원</button><button class="danger" id="wipe">모든 기록 삭제</button></div><div id="wipeBox" hidden style="margin-top:10px" class="notice small">정말 삭제할까요? 되돌릴 수 없어요. <button class="sm danger" id="wipeYes" style="margin-left:8px">네, 삭제합니다</button></div></div>`;
 const KEYS=['log','students','subs','notices','scores','bank.vocab','bank.grammar'];
 $('#imp').onclick=()=>{try{const d=JSON.parse(decodeURIComponent(escape(atob($('#code').value.trim()))));const L=store.get('log',[]);const have=new Set(L.map(l=>l.t+'|'+l.s+'|'+l.n+'|'+l.type));let n=0;(d.log||[]).forEach(l=>{const k=l.t+'|'+l.s+'|'+l.n+'|'+l.type;if(!have.has(k)){L.push(l);have.add(k);n++}});L.sort((a,b)=>a.t-b.t);store.set('log',L);const st=store.get('students',{});const key=d.student.name+'#'+d.student.no;st[key]=Object.assign(st[key]||{},{name:d.student.name,no:d.student.no,g:d.g,last:Math.max(st[key]?.last||0,...(d.log||[]).map(l=>l.t))});store.set('students',st);const subs=store.get('subs',[]);let m=0;(d.subs||[]).forEach(s=>{if(!subs.some(x=>x.id===s.id)){subs.push(s);m++}});store.set('subs',subs);$('#impMsg').innerHTML=`<span style="color:var(--good)">${esc(d.student.name)} 학생: 활동 ${n}개, 제출물 ${m}개 가져왔어요.</span>`;$('#code').value=''}catch(e){$('#impMsg').innerHTML='<span style="color:var(--bad)">코드를 읽을 수 없어요. 전체를 정확히 붙여 넣었는지 확인하세요.</span>'}};
 $('#bk').onclick=()=>{const o={};KEYS.forEach(k=>o[k]=store.get(k,null));GRADES.forEach(g=>o['range.'+g[0]]=store.get('range.'+g[0],null));copy(JSON.stringify(o))};$('#csv').onclick=()=>copy('시간,학년,번호,이름,활동,내용,점수\n'+L.map(l=>[new Date(l.t).toLocaleString(),gname(l.g),l.n,l.s,l.type,'"'+String(l.detail).replace(/"/g,'""')+'"',l.score??''].join(',')).join('\n'));
 $('#restore').onclick=()=>{try{const o=JSON.parse($('#rs').value);Object.entries(o).forEach(([k,v])=>{if(v!=null)store.set(k,v)});toast('복원했어요');tData(el)}catch(e){toast('JSON 형식이 아니에요')}};$('#wipe').onclick=()=>{$('#wipeBox').hidden=false};$('#wipeYes').onclick=()=>{KEYS.forEach(k=>store.del(k));toast('모두 삭제했어요');tData(el)}}

/* ================= BOOT ================= */
if('speechSynthesis' in window)speechSynthesis.onvoiceschanged=()=>{};
render();
</script>
</body>
</html>
