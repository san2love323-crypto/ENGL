function similarity(a,b){a=norm(a).split(' ').filter(Boolean);b=norm(b).split(' ').filter(Boolean);if(!a.length)return 0;let m=0;const used=new Set();a.forEach(w=>{const i=b.findIndex((x,i)=>x===w&&!used.has(i));if(i>-1){m++;used.add(i)}});return Math.round(m/Math.max(a.length,b.length)*100)}
function diffWords(target,typed){const t=norm(target).split(' '),u=norm(typed).split(' ');return t.map((w,i)=>u[i]===w?`<span style="color:var(--good)">${esc(w)}</span>`:`<span class="hl" style="color:var(--bad)">${esc(w)}</span>`).join(' ')}

 {sem:1,title:'Lesson 2. My Daily Life',subs:[['일반동사의 현재형',['주어가 3인칭 단수(he, she, it, Tom)일 때 동사에 -s/-es: She goes to school at 8.','부정문: don\'t / doesn\'t + 동사원형. 의문문: Do / Does + 주어 + 동사원형?','빈도부사(always, usually, often, sometimes, never)는 일반동사 앞, be동사 뒤.']],['시간·요일 말하기',['시각 묻기: What time is it? – It\'s seven thirty.','전치사: at 7(시각), on Monday(요일), in May(월·계절·연도).','하루 일과 표현: get up, have breakfast, go to bed.']]]},
 {sem:1,title:'Lesson 3. Fun with Friends',subs:[['현재진행형',['지금 하고 있는 일: be동사 + 동사원형-ing. I am reading a book.','-ing 만들기: make→making, run→running, lie→lying.','의문문: What are you doing? – I\'m playing games.']],['제안·요청 표현',['제안: Let\'s + 동사원형 / Why don\'t we ~? / How about -ing?','답하기: Sounds good! / Sorry, I can\'t.','명령문: 동사원형으로 시작(Open the door.), 부정은 Don\'t ~.']]]},
 {sem:2,title:'Lesson 5. My Dream Job',subs:[['want to + 동사원형',['want to / would like to + 동사원형: I want to be a doctor.','직업 어휘: scientist, designer, firefighter, vet, chef, pilot.','이유 말하기: because + 주어 + 동사: … because I like animals.']],['can의 쓰임',['능력: I can swim. / 부정: can\'t(cannot).','허락·요청: Can I use your pen? Can you help me?','be good at + 명사/-ing: She is good at drawing.']]]},
 {sem:2,title:'Lesson 6. Around the World',subs:[['There is / There are',['단수·셀 수 없는 명사엔 There is, 복수엔 There are: There are many islands in Korea.','의문문: Is there a bank near here? – Yes, there is.','부정: There isn\'t / aren\'t any ~.']],['장소 전치사',['in(안에), on(위에·접촉), under(아래), next to(옆에), between A and B, in front of, behind.','길 안내: Go straight. Turn left at the corner. It\'s on your right.','나라·수도·언어 어휘 익히기.']]]},
 {sem:2,title:'Lesson 7·8. Shopping & Healthy Life',subs:[['수량 표현과 How much',['셀 수 있는 명사(apples)엔 many / a few, 셀 수 없는 명사(water, money)엔 much / a little, some(긍정)·any(부정·의문).','가격 묻기: How much is it? / How much are these?','주문·쇼핑: I\'ll take it. Can I try it on?']],['조동사 should와 명령문',['충고: You should get some sleep. / You shouldn\'t eat too much sugar.','must(강한 의무)·have to(해야 한다)·don\'t have to(할 필요 없다) 구분.','건강 어휘: exercise, healthy, stress, habit, rest.']]]}
],
m2:[
 {sem:1,title:'Lesson 1. Express Yourself',subs:[['과거시제',['규칙동사: -ed (play→played, study→studied, stop→stopped).','불규칙동사는 암기: go–went, have–had, see–saw, eat–ate.','부정·의문: didn\'t + 동사원형 / Did you ~? 과거 be동사: was/were.']],['감정·경험 표현',['감정 형용사: excited, nervous, proud, disappointed, bored.','과거 경험 묻기: What did you do last weekend? How was it?','시간 표현: yesterday, last night, two days ago, in 2020.']]]},
 {sem:1,title:'Lesson 2. Plans and Promises',subs:[['미래 표현',['will + 동사원형(즉흥 결정·예측), be going to + 동사원형(계획·근거 있는 예측).','부정: won\'t / isn\'t going to. 의문: Will you ~? Are you going to ~?','미래 시간 표현: tomorrow, next week, this weekend, soon.']],['접속사 when / because / if',['when(~할 때), because(~때문에), if(~한다면)로 두 문장을 잇는다.','조건·시간의 부사절에서는 미래를 현재형으로: If it rains, we will stay home.','이유 묻고 답하기: Why ~? – Because ~.']]]},
 {sem:1,title:'Lesson 3. Compare and Choose',subs:[['비교급과 최상급',['짧은 형용사: -er / the -est (taller, the tallest). 긴 형용사: more / the most (more famous).','불규칙: good–better–best, bad–worse–worst, many/much–more–most.','as + 원급 + as: She is as tall as me.']],['to부정사의 명사적 용법',['to + 동사원형이 주어·목적어·보어 역할: To read is fun. I want to travel.','가주어 it: It is important to exercise.','want, hope, decide, plan, need, learn + to부정사.']]]},
 {sem:2,title:'Lesson 5. Stories Behind the Names',subs:[['수동태 기초',['주어가 동작을 받을 때: be동사 + 과거분사(p.p.). The book was written by Tom.','행위자는 by ~, 중요하지 않으면 생략: English is spoken in many countries.','시제는 be동사로: is made(현재), was made(과거), will be made(미래).']],['접속사와 문장 연결',['when / while / because / although로 복문 만들기.','so(그래서)와 because(왜냐하면)의 방향 차이에 주의.','이야기 순서 표현: First, Then, After that, Finally.']]]},
 {sem:2,title:'Lesson 6·7. Living Together & Science',subs:[['동명사',['동사원형 + -ing가 명사처럼 주어·목적어·보어로 쓰인다: Swimming is fun.','동명사만 목적어로 취하는 동사: enjoy, finish, mind, keep, give up, avoid.','to부정사만 취하는 동사: want, hope, decide, plan / 둘 다: like, love, start, begin.']],['현재완료 기초',['have/has + p.p. 과거에 시작해 현재와 연결된 일.','경험(ever, never, before), 완료(just, already, yet), 계속(for + 기간, since + 시점).','과거시제와 구분: yesterday, last ~, ago 같은 과거 시점 표현과는 함께 쓰지 않는다.']]]},
 {sem:2,title:'Lesson 8. Think Green',subs:[['조건문 if와 재귀대명사',['If + 현재형, 주절 will: If we recycle, we will save the Earth.','재귀대명사: myself, yourself, himself, herself, itself, ourselves, themselves.','재귀 용법(목적어=주어)과 강조 용법(생략 가능) 구분.']],['환경 어휘와 글쓰기',['환경 어휘: recycle, reduce, reuse, pollution, climate, energy, waste.','의견 쓰기 틀: I think ~ because ~. For example, ~. In conclusion, ~.','연결어: However, Also, Therefore, In addition.']]]}
],
m3:[
 {sem:1,title:'Lesson 1. New Beginnings',subs:[['현재완료의 네 가지 용법',['경험: Have you ever been to Jeju? / 완료: I have just finished my homework.','계속: She has lived here for ten years. / 결과: He has lost his key (지금도 없음).','have been to(가 본 적 있다) vs have gone to(가 버리고 없다).']],['간접의문문',['의문문이 문장 안에 들어가면 「의문사 + 주어 + 동사」 어순: I don\'t know where he lives.','의문사가 없으면 if/whether: I wonder if she is okay.','Do you think ~? 뒤에는 의문사가 문장 맨 앞으로: What do you think it is?']]]},
 {sem:1,title:'Lesson 2. Culture and People',subs:[['관계대명사 who / which / that',['두 문장을 하나로: The boy who is singing is my brother.','사람 → who(whom), 사물·동물 → which, 둘 다 → that. 소유격은 whose.','목적격 관계대명사는 생략 가능: the book (that) I read.']],['분사의 형용사 역할',['현재분사(-ing, 능동·진행)와 과거분사(p.p., 수동·완료): a sleeping baby / a broken window.','분사가 구를 이루면 명사 뒤에서 수식: the girl wearing a red hat.','감정 동사: boring(지루하게 하는) / bored(지루함을 느끼는).']]]},
 {sem:1,title:'Lesson 3. Make a Difference',subs:[['사역동사와 지각동사',['make / have / let + 목적어 + 동사원형: She made me clean the room.','see / hear / feel / watch + 목적어 + 동사원형 또는 -ing.','help + 목적어 + (to) 동사원형. get + 목적어 + to부정사.']],['so ~ that / too ~ to / enough to',['so + 형/부 + that + 주어 + 동사: 너무 ~해서 …하다.','too + 형/부 + to부정사: 너무 ~해서 …할 수 없다.','형/부 + enough + to부정사: …할 만큼 충분히 ~하다.']]]},
 {sem:2,title:'Lesson 5. Art Around Us',subs:[['관계대명사 심화',['전치사 + 관계대명사: the house in which I live.','관계대명사 that만 쓰는 경우: 선행사에 최상급·서수·all·the only가 있을 때.','what = the thing(s) which: What I need is time.']],['현재완료진행형',['have been + -ing: 과거부터 지금까지 계속 진행 중인 동작.','It has been raining since this morning.','How long have you been waiting? – For two hours.']]]},
 {sem:2,title:'Lesson 6·7. Smart Consumer & Across the Globe',subs:[['가정법 과거',['현재 사실의 반대: If + 주어 + 과거동사(be는 were), 주어 + would/could + 동사원형.','If I were you, I would apologize.','I wish + 가정법 과거: I wish I had a car.']],['수동태 심화',['조동사 수동태: can be seen, must be done.','4형식 수동태: I was given a gift. / A gift was given to me.','by 이외의 전치사: be interested in, be filled with, be known for.']]]},
 {sem:2,title:'Lesson 8. Looking Ahead',subs:[['관계부사 where / when / why / how',['장소 → where, 시간 → when, 이유 → why, 방법 → how(the way와 함께 쓰지 않음).','= 전치사 + 관계대명사: the day on which = the day when.','This is the town where I was born.']],['접속사 although / since / as',['although / though / even though: 비록 ~일지라도.','since(~ 이후로 / ~때문에), as(~할 때 / ~때문에 / ~처럼) 문맥으로 구분.','양보 vs 이유 접속사를 글의 흐름에 맞게 선택하기.']]]}
],
h1:[
 {sem:1,title:'Lesson 1. Finding Who I Am',subs:[['문장의 5형식 복습',['1형식 S+V, 2형식 S+V+C, 3형식 S+V+O, 4형식 S+V+IO+DO, 5형식 S+V+O+OC.','5형식 목적격보어: 명사·형용사·to부정사·원형부정사·분사.','주어 찾기와 수일치: 긴 주어(구·절)는 단수 취급.']],['to부정사 심화',['부사적 용법: 목적(in order to), 결과, 원인(glad to see), 판단 근거.','의미상 주어: for + 목적격 / 성격 형용사(kind, foolish) 뒤에는 of + 목적격.','too ~ to, enough to, seem to, be to 용법.']]]},
 {sem:1,title:'Lesson 2. The Art of Communication',subs:[['분사구문',['부사절(접속사 + 주어 + 동사) → 분사구문: 접속사·주어 생략, 동사를 -ing로.','Walking along the street, I met an old friend.','수동 분사구문 (Being) tired, / 완료 분사구문 Having finished ~.']],['강조 구문 it ~ that',['It is/was + 강조어구 + that ~: 주어·목적어·부사구 강조.','가주어·진주어 it ~ that과 구별: that절을 빼도 문장이 완전하면 강조 구문.','조동사 do로 동사 강조: I do believe you.']]]},
 {sem:1,title:'Lesson 3. Learning from the Past',subs:[['과거완료',['had + p.p.: 과거의 어느 시점보다 더 앞선 일(대과거).','When I arrived, the train had already left.','과거완료진행형 had been -ing.']],['독해 전략: 주제문과 글의 구조',['주제문은 보통 첫 문장이나 마지막 문장, 역접(However) 뒤에 온다.','예시(for example)·열거(first, second)·대조(on the other hand) 표지어로 구조 파악.','문단별 핵심어를 메모하며 읽기.']]]},
 {sem:2,title:'Lesson 4. The Power of Habits',subs:[['분사구문 심화',['with + 명사 + 분사: with his eyes closed.','접속사를 남긴 분사구문: While reading, she fell asleep.','독립 분사구문: It being rainy, we stayed home.']],['동명사 vs to부정사 의미 차이',['remember/forget/regret + -ing(과거의 일) vs to부정사(미래의 일).','try -ing(시험 삼아 해 보다) vs try to(노력하다). stop -ing(그만두다) vs stop to(멈추고 ~하다).','동명사 관용 표현: be busy -ing, can\'t help -ing, look forward to -ing.']]]},
 {sem:2,title:'Lesson 5. Technology and Us',subs:[['가정법 과거완료',['과거 사실의 반대: If + had p.p., 주어 + would/could + have p.p.','If I had studied harder, I would have passed the test.','혼합 가정법: If I had taken the medicine, I would be fine now.']],['도치',['부정어(Never, Hardly, Not only) 문두 → 조동사 + 주어 + 동사.','장소 부사구 문두 → 동사 + 주어: On the hill stood a castle.','so/neither + 동사 + 주어: So do I. / Neither can I.']]]},
 {sem:2,title:'Lesson 6. Cultural Diversity',subs:[['관계대명사 계속적 용법',['콤마(,) + which/who: 선행사를 보충 설명, that은 쓸 수 없다.','which가 앞 문장 전체를 받기도 한다: He was late, which made her angry.','제한적 용법과 해석 차이: 두 명의 아들 중 vs 아들이 둘뿐.']],['복합관계사',['whoever(누구든지), whatever(무엇이든지), whichever: 명사절·양보 부사절.','whenever, wherever, however + 형/부 + 주어 + 동사.','however hard you try = no matter how hard you try.']]]}
],
h2:[
 {sem:1,title:'Lesson 1. Voices of Youth',subs:[['명사절 접속사 that / whether / if',['that절은 주어·목적어·보어·동격: The fact that he lied is clear.','whether(or not)는 주어·보어·전치사 뒤 가능, if는 목적어 자리만.','의문사절의 어순: 의문사 + 주어 + 동사.']],['동격 표현',['명사 + that절(fact, news, idea, belief, hope).','명사, 명사: Seoul, the capital of Korea.','of를 이용한 동격: the city of Busan.']]]},
 {sem:1,title:'Lesson 2. Science in Life',subs:[['수일치 총정리',['each / every / -thing / -one → 단수. both / several / many → 복수.','a number of + 복수(복수 취급) vs the number of + 복수(단수 취급).','부분 표현(most of, half of, 분수)은 of 뒤 명사에 일치.']],['병렬 구조',['and / but / or로 이어진 요소는 같은 문법 형태.','not only A but also B, either A or B, both A and B, rather than.','비교 구문에서도 대등한 형태: Reading is as important as writing.']]]},
 {sem:1,title:'Lesson 3. Living in a Global Village',subs:[['분사구문과 시제',['단순 분사구문(동시) vs 완료 분사구문 Having p.p.(먼저 일어난 일).','수동 분사구문의 Being / Having been 생략.','분사구문의 부정: Not knowing what to do, ~.']],['독해 전략: 빈칸 추론',['빈칸 문장의 역할(주제문·예시·재진술)을 먼저 판단.','앞뒤 문장의 연결어와 지시어로 논리 흐름 확인.','선택지는 본문 핵심어의 paraphrase인지 검토.']]]},
 {sem:2,title:'Lesson 4. Beyond the Limits',subs:[['과거완료와 시제 일치',['주절이 과거면 종속절도 과거·과거완료로 일치.','불변의 진리·습관·역사적 사실은 시제 일치 예외.','화법 전환 시 시제·인칭·시간 부사 변화(now→then, today→that day).']],['독해 전략: 순서 배열·문장 삽입',['대명사(it, they, this)와 정관사 the가 가리키는 대상 찾기.','연결어(However, Therefore, For example)로 앞뒤 관계 파악.','시간 순서·일반→구체 흐름 확인.']]]},
 {sem:2,title:'Lesson 5. Science and Ethics',subs:[['가정법 심화',['혼합 가정법, without / but for = if it were not for / had not been for.','as if / as though + 가정법: He talks as if he knew everything.','It\'s (high) time + 가정법 과거, should 생략 가정법(suggest that he (should) go).']],['부정어 도치와 강조',['Not until ~ did I realize ~. / Only then did she understand.','Little did I know ~ / No sooner had ~ than ~.','부분 부정(not all, not always)과 전체 부정(none, never).']]]},
 {sem:2,title:'EBS 연계 독해 전략',subs:[['주제·제목·요지',['주제문 + 반복되는 핵심어로 중심 생각 잡기.','제목은 주제를 함축·비유적으로 표현하는 경우가 많다.','요지는 필자의 주장(should, must, need to) 문장에서 찾기.']],['함축 의미 추론',['밑줄 친 표현은 글의 주제와 연결해 해석한다.','비유·역설 표현은 문자 그대로가 아닌 문맥 의미로.','선택지의 극단적 표현(always, never)은 오답일 가능성 높음.']]]}
],
h3:[

 ${items.map(u=>{const ui=list.indexOf(u);const isOpen=open===ui||open==='all';return `<div class="card" style="padding:0;overflow:hidden"><button data-u="${ui}" style="width:100%;text-align:left;border:none;background:transparent;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-radius:0"><b style="font-size:16px">${u.custom?'🤖 ':''}${esc(u.title)}</b><span class="pill">${u.subs.filter((_,si)=>done.includes(ui+'-'+si)).length}/${u.subs.length} · ${isOpen?'접기':'펼치기'}</span></button>
